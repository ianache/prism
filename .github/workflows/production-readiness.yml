name: Production Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install pytest
      - run: python scripts/ci_contract.py .
      - run: python -m pytest tests/test_s14_compose_contract.py tests/test_s15_telemetry_contract.py tests/test_s17_stream_contract.py tests/test_s18_ci_contract.py tests/test_s18_production_preflight.py tests/test_s20_production_gate_contract.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config

  docker-build:
    runs-on: ubuntu-latest
    needs: [rust, contracts, compose]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build server telemetry-client

  production-runtime:
    runs-on: ubuntu-latest
    needs: [rust, contracts, compose, docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Run non-root TLS readiness gate
        run: bash scripts/docker_production_readiness.sh --frames 100000 --batch-size 64 --evidence-dir ./artifacts/s20
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s20-linux-production-gate
          path: artifacts/s20/
